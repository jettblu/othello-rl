[package]
name = "othello-ai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rl-gym = { path = "../../../../rl-gym", default-features = false }
burn = { version = "0.18", default-features = false, features = ["std", "ndarray"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
