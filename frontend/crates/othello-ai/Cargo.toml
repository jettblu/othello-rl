[package]
name = "othello-ai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rl-gym = { git = "https://github.com/jettblu/rl-gym.git", rev = "68eb34595808b8d7ba7ec7ef74338c7100f62c3d", default-features = false }
burn = { version = "0.18", default-features = false, features = ["std", "ndarray"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
