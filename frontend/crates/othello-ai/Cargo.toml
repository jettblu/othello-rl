[package]
name = "othello-ai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[example]]
name = "mcts_sweep"
path = "examples/mcts_sweep.rs"

[[example]]
name = "trace_coverage"
path = "examples/trace_coverage.rs"

[dependencies]
rl-gym = { git = "https://github.com/jettblu/rl-gym.git", rev = "b42d771b596f700d0e113ec3d2e700adb63c917b", default-features = false }
burn = { version = "0.18", default-features = false, features = ["std", "ndarray"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
