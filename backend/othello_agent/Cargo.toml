[package]
name = "othello_agent"
version = "0.1.2"
edition = "2021"
description = "A simple Othello library. Contains useful methods for interacting with the game and creating autonomous Othello agents."
repository = "https://github.com/jettblu/othello-agent"
authors = ["Jett Hays <jetthays.com>"]
license = "Apache-2.0"

[features]
default = ["training"]
training = ["dep:burn", "dep:csv", "dep:rl_examples"]

[dependencies]
rand = "0.8.5"
serde = { version = "1.0.130", features = ["derive"] }
burn = { version = "0.13.2", features=["train", "wgpu"], optional = true }
csv = { version = "1.1.6", optional = true }
rl_examples = { version = "0.1.0", optional = true }
